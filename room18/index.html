<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>最后一间房</title>
<style>
/* ==========================================================================
   0. 一点变量
   ========================================================================== */
:root{
  --u: calc(100vw / 390);
  --ease: cubic-bezier(.22,.68,.16,1);
  --desk-warm: #4a3121;
  --ink: #5c4430;
}
html,body{ height:100%; margin:0; }
body{
  background:#0b0908;
  overflow:hidden;
  font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
              "Microsoft YaHei", system-ui, sans-serif;
  color:#e9dcc4;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ==========================================================================
   1. 舞台：手机满屏，电脑上居中成一扇窗
   ========================================================================== */
.stage{
  position:fixed; left:0; right:0; top:0;
  height:100vh; height:100dvh;
  display:grid; place-items:center;
}
.room{
  position:relative;
  width:100%; height:100%;
  overflow:hidden;
  background:
    radial-gradient(120% 80% at 30% 18%, #241a13 0%, #140f0c 46%, #0a0807 100%);
}
@media (min-width:760px){
  .room{
    width:min(480px, calc(100vh * 390 / 844));
    height:min(calc(480px * 844 / 390), 100vh);
    border-radius:3px;
    box-shadow:0 30px 90px rgba(0,0,0,.8);
  }
}

/* ==========================================================================
   2. 墙、桌面
   ========================================================================== */
.wall{
  position:absolute; inset:0 0 50% 0;
  background:
    linear-gradient(180deg, rgba(38,28,21,.9) 0%, rgba(26,19,15,.75) 60%, rgba(20,14,11,.6) 100%),
    radial-gradient(90% 70% at 26% 42%, rgba(255,203,140,.10), transparent 70%);
}
.desk{
  position:absolute; left:0; right:0; top:50%; bottom:0;
  background:
    linear-gradient(180deg, #6b4a32 0%, #5a3d29 18%, #4a3121 52%, #35220f 100%);
  box-shadow:inset 0 calc(var(--u)*10) calc(var(--u)*18) rgba(0,0,0,.45);
}
/* 木纹 */
.desk::before{
  content:''; position:absolute; inset:0;
  background:
    repeating-linear-gradient(96deg,
      rgba(255,214,164,.05) 0 calc(var(--u)*1.5),
      rgba(0,0,0,.045) calc(var(--u)*1.5) calc(var(--u)*7),
      rgba(255,214,164,.03) calc(var(--u)*7) calc(var(--u)*13));
  opacity:.75;
  mix-blend-mode:soft-light;
}
/* 木桌前沿的一点高光 */
.desk::after{
  content:''; position:absolute; left:0; right:0; top:0; height:calc(var(--u)*12);
  background:linear-gradient(180deg, rgba(255,214,164,.16), transparent);
}
/* 台灯从左上打下来的一圈暖光 */
.lamp{
  position:absolute; left:-14%; top:6%; width:76%; height:64%;
  background:radial-gradient(closest-side, rgba(255,198,130,.24), rgba(255,178,104,.10) 52%, transparent 78%);
  filter:blur(calc(var(--u)*16));
  pointer-events:none;
  animation:lampBreath 7.5s ease-in-out infinite;
}
@keyframes lampBreath{
  0%,100%{ opacity:.9; }
  50%{ opacity:1; }
}
/* 桌面上的光池 */
.pool{
  position:absolute; left:14%; top:38%; width:72%; height:26%;
  background:radial-gradient(closest-side, rgba(255,206,150,.26), transparent 76%);
  filter:blur(calc(var(--u)*12));
  pointer-events:none;
}

/* ==========================================================================
   3. 桌上的两样东西
   ========================================================================== */
.obj{
  position:absolute;
  display:block;
  border:0; padding:0; background:none;
  cursor:pointer;
  transform-origin:50% 50%;
}
.obj img{
  display:block; width:100%; height:auto;
  filter:drop-shadow(0 calc(var(--u)*6) calc(var(--u)*10) rgba(0,0,0,.55));
  transition:transform 420ms var(--ease), filter 420ms var(--ease);
}
.obj:active img{ transform:scale(.985); filter:drop-shadow(0 calc(var(--u)*3) calc(var(--u)*6) rgba(0,0,0,.6)) brightness(1.03); }

/* 本子：正中偏左，占主导 */
#book{
  left:14%; top:26%;
  width:56%;
  transform:rotate(-1.2deg);
}
/* 本子自身的一圈暖光（它才是暗房里唯一的光源） */
#book::after{
  content:''; position:absolute; left:-18%; top:-14%; width:136%; height:128%;
  background:radial-gradient(closest-side, rgba(255,204,148,.30), rgba(255,190,120,.12) 55%, transparent 80%);
  filter:blur(calc(var(--u)*12));
  z-index:-1;
  pointer-events:none;
}
/* 相册：右下，小一点，压在桌上 */
#album{
  left:60%; top:56%;
  width:30%;
  transform:rotate(4deg);
}

/* ==========================================================================
   4. 底部那行小字
   ========================================================================== */
.subtle{
  position:absolute; left:0; right:0; bottom:calc(var(--u)*26);
  text-align:center;
  font-size:calc(var(--u)*13);
  letter-spacing:.32em;
  color:rgba(233,220,196,.42);
  pointer-events:none;
  text-indent:.32em;
}

/* ==========================================================================
   5. 读信
   ========================================================================== */
.read{
  position:absolute; inset:0; z-index:40;
  display:none;
}
body[data-read="1"] .read{ display:block; }
.read-backdrop{
  position:absolute; inset:0;
  background:radial-gradient(100% 80% at 50% 44%, rgba(20,14,10,.72), rgba(4,3,2,.94) 76%);
  animation:fadeIn 460ms ease both;
}
.read-sheet{
  position:absolute; left:50%; top:50%;
  width:86%; max-width:calc(var(--u)*340);
  transform:translate(-50%,-50%);
  border-radius:calc(var(--u)*3);
  background:
    radial-gradient(120% 90% at 42% 26%, rgba(255,252,243,.5), transparent 60%),
    linear-gradient(170deg,#fdf5e6,#f6e9cd 52%,#eedfc2);
  box-shadow:
    0 calc(var(--u)*18) calc(var(--u)*40) rgba(0,0,0,.62),
    0 0 calc(var(--u)*36) rgba(255,196,140,.22),
    inset 0 0 calc(var(--u)*18) rgba(150,116,74,.14);
  overflow:hidden;
  animation:sheetIn 520ms var(--ease) both;
}
@keyframes sheetIn{
  from{ opacity:0; transform:translate(-50%,-47%) scale(.96); }
  to{ opacity:1; transform:translate(-50%,-50%) scale(1); }
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.read-scroll{
  max-height:64vh; max-height:64dvh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:calc(var(--u)*30) calc(var(--u)*24);
  color:var(--ink);
}
.read-next{
  position:absolute; left:50%; bottom:calc(var(--u)*30);
  transform:translateX(-50%);
  padding:calc(var(--u)*10) calc(var(--u)*26);
  font:inherit; font-size:calc(var(--u)*13); letter-spacing:.18em;
  color:#f2e3c6;
  background:rgba(28,20,14,.72);
  border:1px solid rgba(255,214,160,.30);
  border-radius:999px;
  backdrop-filter:blur(8px);
  cursor:pointer;
}

/* 信纸上的字（现在没有真迹，先用排好的占位行） */
.ink-line{
  height:calc(var(--u)*2);
  margin:0 0 calc(var(--u)*15);
  border-radius:2px;
  background:linear-gradient(90deg, rgba(92,68,48,.42), rgba(92,68,48,.30) 62%, rgba(92,68,48,.12));
}
.ink-line.short{ width:58%; }
.ink-line.date{ width:34%; margin-left:auto; margin-bottom:calc(var(--u)*24); }
.ink-line.sign{ width:30%; margin-left:auto; margin-top:calc(var(--u)*22); }
.ink-gap{ height:calc(var(--u)*10); }

/* ==========================================================================
   6. 相册
   ========================================================================== */
.lb{
  position:absolute; inset:0; z-index:50; display:none;
}
body[data-lb="1"] .lb{ display:block; }
.lb-backdrop{
  position:absolute; inset:0;
  background:rgba(6,4,3,.88);
  animation:fadeIn 320ms ease both;
}
.lb-card{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:82%; aspect-ratio:3/4;
  border-radius:calc(var(--u)*4);
  background:
    repeating-linear-gradient(0deg, transparent 0 96%, rgba(140,110,78,.18) 96% 100%),
    linear-gradient(160deg,#fbf4e6,#efe2c9);
  box-shadow:0 calc(var(--u)*24) calc(var(--u)*50) rgba(0,0,0,.7);
  display:grid; place-items:center;
  color:#8b6f4e; font-size:calc(var(--u)*13); letter-spacing:.2em;
  animation:sheetIn 380ms var(--ease) both;
}
.lb-cap{
  position:absolute; left:0; right:0; bottom:calc(var(--u)*34);
  text-align:center; font-size:calc(var(--u)*11.5); letter-spacing:.2em;
  color:rgba(233,220,196,.5);
}
</style>
</head>
<body>
<div class="stage">
  <div class="room" id="room">
    <div class="wall"></div>
    <div class="desk"></div>
    <div class="lamp"></div>
    <div class="pool"></div>

    <button class="obj" id="book" type="button" aria-label="打开这本本子">
      <img id="book-img" src="assets/notebook.webp" alt="">
    </button>

    <button class="obj" id="album" type="button" aria-label="打开相册">
      <img id="album-img" src="assets/album.png" alt="">
    </button>

    <div class="subtle">在我眼中&nbsp;&nbsp;在我心中</div>

    <!-- 读信 -->
    <div class="read" id="read">
      <div class="read-backdrop" id="read-backdrop"></div>
      <div class="read-sheet">
        <div class="read-scroll" id="read-scroll"></div>
      </div>
      <button class="read-next" id="read-next" type="button">读完了</button>
    </div>

    <!-- 相册 -->
    <div class="lb" id="lb">
      <div class="lb-backdrop" id="lb-backdrop"></div>
      <div class="lb-card" id="lb-card">照片还在路上</div>
      <div class="lb-cap" id="lb-cap">点一下收起</div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   配置：以后要换的东西都在这里
   ========================================================================== */
const CONFIG = {
  assets: {
    book:  'assets/notebook.webp',   /* 本子封面 */
    album: 'assets/album.png',       /* 相册封面 */
    letterPage: ''                   /* 本子里写了字那页，有了填路径就自动换掉占位字 */
  },
  lines: 16,                         /* 相册里要放几张照片 */
  hint: '轻点这个本子'
};

/* 把封面挂上去（配置里换了路径不用改别的） */
document.getElementById('book-img').src  = CONFIG.assets.book;
document.getElementById('album-img').src = CONFIG.assets.album;

/* ==========================================================================
   读信
   ========================================================================== */
const readRoot   = document.getElementById('read');
const readScroll = document.getElementById('read-scroll');
const readNext   = document.getElementById('read-next');

function buildLetter(){
  const A = CONFIG.assets;
  if (A.letterPage) {
    readScroll.style.padding = '0';
    readScroll.innerHTML = `<img src="${A.letterPage}" alt="" style="display:block;width:100%;height:auto">`;
    return;
  }
  /* 没有真迹就先摆一页字 */
  const rows = [];
  rows.push('<div class="ink-line date"></div>');
  for (let p = 0; p < 3; p++) {
    const n = [7, 6, 5][p];
    for (let i = 0; i < n; i++) {
      rows.push(`<div class="ink-line${i === n - 1 ? ' short' : ''}"></div>`);
    }
    if (p < 2) rows.push('<div class="ink-gap"></div>');
  }
  rows.push('<div class="ink-line sign"></div>');
  readScroll.innerHTML = rows.join('');
}

function openRead(){
  buildLetter();
  document.body.dataset.read = '1';
  readScroll.scrollTop = 0;
}
function closeRead(){
  delete document.body.dataset.read;
}

document.getElementById('book').addEventListener('click', openRead);
readNext.addEventListener('click', (e) => { e.stopPropagation(); closeRead(); });
document.getElementById('read-backdrop').addEventListener('click', closeRead);

/* ==========================================================================
   相册
   ========================================================================== */
const lbCard = document.getElementById('lb-card');
const lbCap  = document.getElementById('lb-cap');

function openAlbum(){
  lbCard.textContent = '照片还在路上';
  lbCap.textContent = '点一下收起';
  document.body.dataset.lb = '1';
}
function closeAlbum(){ delete document.body.dataset.lb; }

document.getElementById('album').addEventListener('click', openAlbum);
document.getElementById('lb-backdrop').addEventListener('click', closeAlbum);

/* ==========================================================================
   键盘（电脑上也能用）
   ========================================================================== */
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeAlbum(); closeRead(); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === document.getElementById('book')) {
    e.preventDefault(); openRead();
  }
});
</script>
</body>
</html>
